<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>国潮商城</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="dark-page">
    <nav class="nav">
      <div class="brand">衣台</div>
      <div class="nav-links">
        <a href="#">新品</a>
        <a href="#">男装</a>
        <a href="#">女装</a>
        <a href="#">山海经系列</a>
        <a href="./index.html">返回目录</a>
      </div>
      <div class="nav-actions">
        <a class="pill" href="#">购物车</a>
        <a class="pill" href="#">我的设计</a>
      </div>
    </nav>

    <main class="shop-shell">
      <aside class="shop-sidebar">
        <span class="seal">潮</span>
        <h2 style="font-family:var(--serif);font-size:32px">筛选</h2>
        <div class="filter-list">
          <button>热卖榜</button>
          <button>山海神兽</button>
          <button>水墨极简</button>
          <button>情侣款</button>
          <button>重磅黑 T</button>
          <button>宽松白 T</button>
        </div>
      </aside>

      <section class="shop-main">
        <div class="shop-head">
          <div>
            <p class="small-caps">Chinese streetwear marketplace</p>
            <h1 class="shop-title">不是模板商城，是中国文化衣橱</h1>
          </div>
          <p class="lead" style="color:rgba(245,239,227,.72)">
            商城页要能承接真实交易：分类、搜索、销量、作品广场都可以塞进来，但视觉必须比普通卡片网格更有品牌感。
          </p>
        </div>

        <div class="product-grid">
          <article class="product-card wide">
            <img src="./assets/product-flatlay.png" alt="山海经 T 恤系列商品图" />
            <div class="product-meta">
              <div>
                <strong>山海四象系列</strong>
                <p>应龙、九尾、玄鸟、云山纹</p>
              </div>
              <span class="price">¥169 起</span>
            </div>
          </article>
          <article class="product-card">
            <img src="./assets/female-model.png" alt="女款山海经 T 恤" />
            <div class="product-meta">
              <div>
                <strong>九尾狐女款</strong>
                <p>宽松落肩版</p>
              </div>
              <span class="price">¥139</span>
            </div>
          </article>
          <article class="product-card">
            <img src="./assets/male-model.png" alt="男款山海经 T 恤" />
            <div class="product-meta">
              <div>
                <strong>应龙黑金男款</strong>
                <p>重磅 260g</p>
              </div>
              <span class="price">¥159</span>
            </div>
          </article>
          <article class="product-card wide">
            <img src="./assets/tryon-models.png" alt="男女试穿效果展示" />
            <div class="product-meta">
              <div>
                <strong>男女同款试衣展示</strong>
                <p>适合放在商品详情页，降低用户下单犹豫。</p>
              </div>
              <span class="price">AI 试穿</span>
            </div>
          </article>
          <article class="product-card">
            <img src="./assets/hero-models.png" alt="中国模特品牌大片" />
            <div class="product-meta">
              <div>
                <strong>本周主推</strong>
                <p>山海经限定色</p>
              </div>
              <span class="price">热卖</span>
            </div>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
