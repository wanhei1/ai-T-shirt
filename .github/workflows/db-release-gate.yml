name: DB Release Gate

on:
  pull_request:
    paths:
      - backend/**
      - package.json
      - package-lock.json
      - .github/workflows/db-release-gate.yml
  push:
    branches:
      - main
      - master
    paths:
      - backend/**
      - package.json
      - package-lock.json
      - .github/workflows/db-release-gate.yml
  workflow_dispatch:

jobs:
  db-check:
    name: Release DB Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tshirt_designer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tshirt_designer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tshirt_designer
      NODE_ENV: test
      RUN_STARTUP_MIGRATIONS: true
      MIGRATION_ONLY: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build:backend

      - name: Run release DB gate
        run: npm run release:db:check
