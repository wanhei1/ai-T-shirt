route:
  receiver: default
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h
  routes:
    - matchers:
        - alertname="BillingReconciliationMismatch"
      receiver: incident-ticket-bot
      continue: true

    - matchers:
        - severity="warning"
        - slo="financial-consistency"
      receiver: default
      mute_time_intervals:
        - night-quiet-hours

    - matchers:
        - severity="critical"
      receiver: critical-oncall
      continue: true

receivers:
  - name: default
    webhook_configs:
      - url: http://example-webhook.local/alerts/default
        send_resolved: true

  - name: critical-oncall
    webhook_configs:
      - url: http://example-webhook.local/alerts/critical
        send_resolved: true

  - name: incident-ticket-bot
    webhook_configs:
      - url: http://lb:8080/api/ops/alerts/ticket?token=alert-ticket-2026-04-07-vf7k9m2p4q1x8z
        send_resolved: true

time_intervals:
  - name: night-quiet-hours
    time_intervals:
      - times:
          - start_time: '00:00'
            end_time: '08:00'
        location: 'Asia/Shanghai'

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [alertname, service, dependency]
