global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - rules/tshirt-alerts.yml

scrape_configs:
  - job_name: backend-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api1:8181
          - api2:8181

  - job_name: backend-api-local
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:8181
