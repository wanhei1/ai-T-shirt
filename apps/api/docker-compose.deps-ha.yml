version: "3.9"

services:
  redis-master:
    image: bitnami/redis:7.2
    environment:
      REDIS_REPLICATION_MODE: master
      REDIS_PASSWORD: redis_ha_password
    ports:
      - "6379:6379"

  redis-replica-1:
    image: bitnami/redis:7.2
    depends_on:
      - redis-master
    environment:
      REDIS_REPLICATION_MODE: replica
      REDIS_MASTER_HOST: redis-master
      REDIS_MASTER_PORT_NUMBER: 6379
      REDIS_MASTER_PASSWORD: redis_ha_password
      REDIS_PASSWORD: redis_ha_password

  redis-replica-2:
    image: bitnami/redis:7.2
    depends_on:
      - redis-master
    environment:
      REDIS_REPLICATION_MODE: replica
      REDIS_MASTER_HOST: redis-master
      REDIS_MASTER_PORT_NUMBER: 6379
      REDIS_MASTER_PASSWORD: redis_ha_password
      REDIS_PASSWORD: redis_ha_password

  redis-sentinel:
    image: bitnami/redis-sentinel:7.2
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2
    environment:
      REDIS_MASTER_SET: tshirt-redis
      REDIS_MASTER_HOST: redis-master
      REDIS_MASTER_PORT_NUMBER: 6379
      REDIS_MASTER_PASSWORD: redis_ha_password
      REDIS_SENTINEL_QUORUM: 2
      REDIS_SENTINEL_DOWN_AFTER_MILLISECONDS: 5000
      REDIS_SENTINEL_FAILOVER_TIMEOUT: 10000
      REDIS_SENTINEL_PASSWORD: redis_ha_password
    ports:
      - "26379:26379"

  rabbitmq-1:
    image: rabbitmq:3.13-management
    hostname: rabbitmq-1
    environment:
      RABBITMQ_ERLANG_COOKIE: SUPERSECRETCOOKIE
      RABBITMQ_DEFAULT_USER: tshirt_app
      RABBITMQ_DEFAULT_PASS: rabbit_ha_password
      RABBITMQ_DEFAULT_VHOST: tshirt
    ports:
      - "5672:5672"
      - "15672:15672"

  rabbitmq-2:
    image: rabbitmq:3.13-management
    hostname: rabbitmq-2
    depends_on:
      - rabbitmq-1
    environment:
      RABBITMQ_ERLANG_COOKIE: SUPERSECRETCOOKIE

  rabbitmq-3:
    image: rabbitmq:3.13-management
    hostname: rabbitmq-3
    depends_on:
      - rabbitmq-1
    environment:
      RABBITMQ_ERLANG_COOKIE: SUPERSECRETCOOKIE

  postgres-primary:
    image: bitnami/postgresql-repmgr:16
    environment:
      POSTGRESQL_POSTGRES_PASSWORD: postgres_admin_password
      POSTGRESQL_USERNAME: tshirt_user
      POSTGRESQL_PASSWORD: tshirt_db_password
      POSTGRESQL_DATABASE: tshirt_db
      REPMGR_PASSWORD: repmgr_password
      REPMGR_PRIMARY_HOST: postgres-primary
      REPMGR_NODE_NAME: postgres-primary
      REPMGR_NODE_NETWORK_NAME: postgres-primary

  postgres-standby:
    image: bitnami/postgresql-repmgr:16
    depends_on:
      - postgres-primary
    environment:
      POSTGRESQL_POSTGRES_PASSWORD: postgres_admin_password
      POSTGRESQL_USERNAME: tshirt_user
      POSTGRESQL_PASSWORD: tshirt_db_password
      POSTGRESQL_DATABASE: tshirt_db
      REPMGR_PASSWORD: repmgr_password
      REPMGR_PRIMARY_HOST: postgres-primary
      REPMGR_NODE_NAME: postgres-standby
      REPMGR_NODE_NETWORK_NAME: postgres-standby
